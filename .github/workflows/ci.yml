name: CI Tests

on:
  push:
    branches: ["main", "master"]
  pull_request:
    branches: ["main", "master"]

jobs:
  test:
    name: Test Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # polpy requires python>=3.12 (see pyproject.toml)
        python-version: ["3.12"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Upgrade pip & install package dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest pytest-cov
          # tests/test_real_data_joint_fit.py needs TimeSeriesBuilder.from_polarization /
          # to_polarizationlike, which only exist on the "polpy" branch of threeML, not
          # the PyPI release pyproject.toml pins (>=2.5.0). Install it first so pip
          # treats the >=2.5.0 constraint as already satisfied and leaves it alone.
          pip install "threeML @ git+https://github.com/threeML/threeML.git@polpy"
          pip install -e .

      - name: Run unit tests with coverage
        run: |
          pytest --cov=polpy --cov-report=term-missing tests/
