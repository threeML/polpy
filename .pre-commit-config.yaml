repos:
  - repo: https://github.com/psf/black
    rev: 25.11.0  # Use the latest stable Black version
    hooks:
      - id: black
        language_version: python3

  - repo: https://github.com/python-poetry/poetry
    rev: 2.2.1  # Match this with your locally installed poetry version
    hooks:
      - id: poetry-check
      - id: poetry-lock